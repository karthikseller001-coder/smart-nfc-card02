<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart NFC Digital Card Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-b from-purple-300 via-indigo-100 to-purple-300 text-slate-800 font-sans min-h-screen flex flex-col items-center justify-center p-0 m-0 antialiased selection:bg-purple-500 selection:text-white">

    <div class="w-full max-w-md min-h-screen flex flex-col justify-between pt-6 pb-6 px-6 relative overflow-hidden bg-gradient-to-b from-purple-200 via-indigo-50 to-purple-200 shadow-2xl">
        
        <div class="text-center mt-2 relative flex flex-col items-center">
            <div id="profileLogoContainer" class="w-24 h-24 mx-auto rounded-full bg-[#1e1b4b] flex items-center justify-center text-white shadow-2xl mb-3 border-4 border-white/70 overflow-hidden aspect-square">
            </div>
            <h1 id="displayTitle" class="font-extrabold text-3xl text-[#1e1b4b] tracking-tight"></h1>
            <p id="displaySubtitle" class="text-sm font-bold text-slate-700 mt-1"></p>
        </div>

        <div id="linksRenderList" class="w-full space-y-3.5 my-4"></div>

        <div class="w-full py-3.5 text-center bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-[2rem] shadow-lg mt-auto px-6 mb-3">
            <p id="displayFooterMsg" class="text-sm font-bold tracking-wide flex items-center justify-center gap-1.5">
                <span>Thank you for visiting!</span>
                <i class="fa-solid fa-heart text-rose-300 text-sm"></i>
            </p>
        </div>

        <div class="w-full flex items-center justify-between pt-1 border-t border-purple-300/60 text-xs font-semibold px-1">
            <div class="flex items-center text-slate-700 text-xs">
                <span id="displayFooterText" class="text-slate-800 text-xs font-semibold">Provided by Smart Cards</span>
            </div>
            <a id="displayContactLink" href="#" target="_blank" class="text-blue-600 hover:text-blue-800 font-bold text-xs transition-colors cursor-pointer">
                <span id="displayConnectText">Connect</span>
            </a>
        </div>

    </div>

    <!-- Session Expired Screen -->
    <div id="sessionExpiredScreen" class="fixed inset-0 bg-gradient-to-b from-purple-900 via-slate-900 to-indigo-950 z-40 hidden flex flex-col items-center justify-center p-6 text-center text-white">
        <div class="w-20 h-20 rounded-full bg-white/10 flex items-center justify-center text-rose-400 text-3xl mb-4 border border-white/20 shadow-2xl">
            <i class="fa-solid fa-clock-rotate-left"></i>
        </div>
        <h2 id="expireTitle" class="text-2xl font-black mb-2">Session Expired</h2>
        <p id="expireSubtitle" class="text-purple-200 text-sm max-w-xs mb-2 font-semibold">Thank you for visiting!</p>
        <p id="expireFooter" class="text-purple-300 text-xs max-w-xs mb-6 leading-relaxed">Please visit our shop again, scan the code, and leave us a review.</p>
        <button onclick="restartSession()" class="px-6 py-2.5 bg-white text-purple-950 font-bold text-xs rounded-xl shadow-lg hover:bg-purple-50 transition-all cursor-pointer">
            Scan Again / Refresh
        </button>
    </div>

    <script>
        // // Edit 
        const cardData = {
            title: "Dream Studio",
            subtitle: "Follow • Connect • Explore",
            logoUrl: "https://raw.githubusercontent.com/karthikseller001-coder/smart-nfc-card02/refs/heads/main/1794122428463.png", 
            footerText: "Provided by Smart Cards",
            connectText: "Connect",
            connectUrl: "https://instagram.com",

            session: {
                expiryMinutes: 2,
                title: "Session Expired",
                subtitle: "Thank you for visiting!",
                footer: "Please visit our shop again, scan the code, and leave us a review."
            },

            links: [
                { 
                    id: 1, 
                    type: "instagram", 
                    title: "Instagram", 
                    value: "https://instagram.com", 
                    iconClass: "fa-brands fa-instagram", 
                    customImg: "", 
                    bgClass: "bg-gradient-to-tr from-amber-500 via-rose-500 to-purple-600" 
                },
                { 
                    id: 2, 
                    type: "whatsapp", 
                    title: "WhatsApp", 
                    value: "+919876543210", 
                    iconClass: "fa-brands fa-whatsapp", 
                    customImg: "", 
                    bgClass: "bg-emerald-500" 
                },
                { 
                    id: 3, 
                    type: "facebook", 
                    title: "Facebook", 
                    value: "https://facebook.com", 
                    iconClass: "fa-brands fa-facebook-f", 
                    customImg: "", 
                    bgClass: "bg-blue-600" 
                },
                { 
                    id: 4, 
                    type: "google", 
                    title: "Google", 
                    value: "https://google.com", 
                    iconClass: "fa-brands fa-google", 
                    customImg: "", 
                    bgClass: "bg-white text-rose-500 border border-slate-200" 
                },
                { 
                    id: 5, 
                    type: "info", 
                    title: "Business Hours", 
                    value: "9 AM – 9 PM", 
                    iconClass: "fa-regular fa-clock", 
                    customImg: "", 
                    bgClass: "bg-slate-100 text-slate-800" 
                }
            ]
        };

        const SESSION_START_KEY = "nfc_card_session_start_v2";

        function checkSessionExpiry() {
            const expiryMins = parseInt(cardData.session.expiryMinutes || 0);
            const sessionEl = document.getElementById('sessionExpiredScreen');
            if (!sessionEl) return;

            if (expiryMins <= 0) {
                sessionEl.classList.add('hidden');
                return;
            }
            let sessionStart = sessionStorage.getItem(SESSION_START_KEY);
            if (!sessionStart) {
                sessionStart = Date.now().toString();
                sessionStorage.setItem(SESSION_START_KEY, sessionStart);
            }
            const elapsedMinutes = (Date.now() - parseInt(sessionStart)) / (1000 * 60);
            if (elapsedMinutes >= expiryMins) {
                sessionEl.classList.remove('hidden');
            } else {
                sessionEl.classList.add('hidden');
            }
        }

        function restartSession() {
            sessionStorage.setItem(SESSION_START_KEY, Date.now().toString());
            const sessionEl = document.getElementById('sessionExpiredScreen');
            if(sessionEl) sessionEl.classList.add('hidden');
            renderCard();
        }

        function renderCard() {
            document.getElementById('displayTitle').innerText = cardData.title || "";
            document.getElementById('displaySubtitle').innerText = cardData.subtitle || "";
            document.getElementById('displayFooterText').innerText = cardData.footerText || "";
            document.getElementById('displayConnectText').innerText = cardData.connectText || "";
            document.getElementById('displayContactLink').href = cardData.connectUrl || "#";

            document.getElementById('expireTitle').innerText = cardData.session.title || "";
            document.getElementById('expireSubtitle').innerText = cardData.session.subtitle || "";
            document.getElementById('expireFooter').innerText = cardData.session.footer || "";

            const logoContainer = document.getElementById('profileLogoContainer');
            if (logoContainer) {
                if (cardData.logoUrl && cardData.logoUrl.trim() !== "") {
                    logoContainer.innerHTML = `<img src="${cardData.logoUrl}" class="w-full h-full object-cover rounded-full aspect-square">`;
                } else {
                    logoContainer.innerHTML = `
                    <svg viewBox="0 0 100 100" class="w-14 h-14 fill-none stroke-white stroke-[2.5] stroke-linecap-round stroke-linejoin-round">
                        <path d="M50,22 C40,40 42,65 50,70 C58,65 60,40 50,22 Z" />
                        <path d="M50,70 C30,65 20,45 28,30 C38,40 45,55 50,70 Z" />
                        <path d="M50,70 C70,65 80,45 72,30 C62,40 55,55 50,70 Z" />
                    </svg>`;
                }
            }

            const container = document.getElementById('linksRenderList');
            if (!container) return;
            container.innerHTML = "";

            if (cardData.links && Array.isArray(cardData.links)) {
                cardData.links.forEach(link => {
                    let hrefAttr = "#";
                    let isClickable = true;

                    if (link.type === 'whatsapp') {
                        const cleanNum = link.value ? link.value.replace(/[^0-9]/g, '') : '';
                        hrefAttr = `https://wa.me/${cleanNum}`;
                    } else if (link.type === 'info') {
                        isClickable = false;
                    } else {
                        hrefAttr = link.value && link.value.startsWith('http') ? link.value : `https://${link.value || ''}`;
                    }

                    let iconContent = link.customImg && link.customImg.trim() !== "" 
                        ? `<img src="${link.customImg}" class="w-full h-full object-cover aspect-square rounded-xl">`
                        : `<i class="${link.iconClass || 'fa-solid fa-globe'} text-xl"></i>`;

                    if (isClickable) {
                        container.innerHTML += `
                        <a href="${hrefAttr}" target="_blank" class="w-full bg-white/95 backdrop-blur rounded-2xl p-4 flex items-center justify-between shadow-md border border-white hover:scale-[1.02] active:scale-[0.98] transition-all">
                            <div class="flex items-center space-x-4">
                                <div class="w-11 h-11 aspect-square rounded-xl ${link.bgClass || 'bg-purple-600 text-white'} flex items-center justify-center shadow-sm overflow-hidden flex-shrink-0">
                                    ${iconContent}
                                </div>
                                <span class="font-bold text-base text-slate-900">${link.title}</span>
                            </div>
                            <i class="fa-solid fa-chevron-right text-sm font-bold text-slate-600"></i>
                        </a>`;
                    } else {
                        container.innerHTML += `
                        <div class="w-full bg-white/95 backdrop-blur rounded-2xl p-4 flex items-center space-x-4 shadow-md border border-white">
                            <div class="w-11 h-11 aspect-square rounded-xl ${link.bgClass || 'bg-slate-100 text-slate-800'} flex items-center justify-center shadow-sm overflow-hidden flex-shrink-0">
                                ${iconContent}
                            </div>
                            <div class="text-left">
                                <span class="block text-sm font-bold text-slate-900">${link.title}</span>
                                <span class="block text-xs font-semibold text-slate-600">${link.value}</span>
                            </div>
                        </div>`;
                    }
                });
            }
        }

        window.onload = function() {
            renderCard();
            checkSessionExpiry();
            setInterval(checkSessionExpiry, 30000);
        };
    </script>
</body>
</html>
